# Local PostgreSQL for manual dev/testing of the DATABASE_PROVIDER=postgresql
# path. Not used by `npm run dev`, which defaults to SQLite (see
# docs/architecture/redesign/01-multi-database-support.md). By default (plain
# `docker compose up`) only `postgres` starts — the server still runs on the
# host via `npm run dev -w server` / `DATABASE_PROVIDER=postgresql npm run
# dev -w server`.
#
# The `app` service is opt-in (profile "full") and exists to exercise the
# containerized Dockerfile.txt entrypoint end-to-end locally — the same
# migrate/seed-gate/healthcheck flow used in production — before pushing a
# deploy. Run it with: docker compose --profile full up --build
#
# For the full profile you MUST supply strong secrets (see environment below).
# Copy docker-compose.override.example.yml or export:
#   JWT_SECRET, JWT_REFRESH_SECRET, SEED_ADMIN_PASSWORD, …
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Override in production / shared hosts: POSTGRES_PASSWORD from env / secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: makthab_dev
    ports:
      # Bind to loopback only — do not publish Postgres on all interfaces.
      - "127.0.0.1:5433:5432"
    volumes:
      - makthab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.txt
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/makthab_dev
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:3000
      # Required in production — compose will fail to start the app without these.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET to a long random string}
      # Required on first boot seed (NODE_ENV=production). Existing user hashes are never overwritten.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD (min 12 chars, not the dev default)}
      # Optional secondary bootstrap accounts (same rules as admin when set):
      SEED_ACCOUNTANT_PASSWORD: ${SEED_ACCOUNTANT_PASSWORD:-}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-}
      # SKIP_SEED: "true"
      # FORCE_RESEED: "true"   # re-runs seed metadata only; does not reset passwords
      # RUN_XLSX_IMPORT: "true"  # requires mounting the xlsx (not in the image)
    # Optional: mount legacy spreadsheet for one-shot import
    # volumes:
    #   - ./docs/source-data:/app/docs/source-data:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  makthab_pg_data:
