name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit (Critical/High)
        # Fails the build on Critical/High advisories (security redesign §6).
        run: npm audit --audit-level=high

      - name: Server integration tests (SQLite)
        working-directory: server
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: |
          npx prisma migrate deploy --schema=./prisma/sqlite/schema.prisma
          npx tsx prisma/seed.ts
          npx jest --runInBand

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.90.0
    steps:
      - uses: actions/checkout@v4
      # High-signal TypeScript/Node rules only — keep noise low for a small team.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --error \
            --metrics=off \
            --quiet \
            server/src packages/shared/src

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
